# Create/select your own Fly app name with --app. Deploy from the repository root.
primary_region = "bom"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "services/bots/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  PORT = "3001"
  CHAIN = "testnet"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
