name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install contract security analyzer
        run: python -m pip install slither-analyzer==0.11.5
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Contract formatting
        working-directory: contracts
        run: forge fmt --check
      - name: Contract build and sizes
        working-directory: contracts
        run: forge build --sizes
      - name: Contract tests
        working-directory: contracts
        run: python3 ../scripts/export-test-summary.py
      - name: Historical hardfork tests
        working-directory: contracts
        # Pre-MIP-8 clearing of a full book exceeds the 30M default; S8 verified with this limit.
        run: FOUNDRY_PROFILE=pre_mip8 forge test --gas-limit 100000000
      - name: Live evidence regression tests
        run: python3 -m unittest discover -s scripts -p test_spike.py
      - name: Local storage gate
        run: pnpm spike
      - name: Auction gas benchmarks
        run: pnpm bench
      - name: Generated gas limit freshness
        run: git diff --exit-code -- packages/core/src/gas.json
      - name: Benchmark formatting
        working-directory: contracts
        run: forge fmt --check bench
      - name: Explicit client gas policy
        run: pnpm check:gas
      - name: Forbidden inputs
        run: bash contracts/script/check-forbidden.sh
      - name: Golden vector freshness
        run: git diff --exit-code -- packages/core/test/vectors.json
      - name: Storage layout and priority-input gates
        run: pnpm check:contracts
      - name: Individually reviewed Slither findings
        run: python3 scripts/check-security.py
      - name: Generated ABI freshness
        run: |
          pnpm gen
          git diff --exit-code -- packages/core/src/abi.ts
      - run: pnpm exec tsc -p tsconfig.scripts.json
      - run: pnpm --filter @batchelor/indexer cloud:check
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm test:tooling
      - run: pnpm -r build
      - name: Terminal typecheck
        run: pnpm terminal:typecheck
      - name: Terminal lint
        run: pnpm terminal:lint
      - name: Terminal tests
        run: pnpm terminal:test
      - name: Terminal build
        run: pnpm terminal:build
      - run: python3 scripts/check-contrast.py
      - name: Retain spike evidence
        uses: actions/upload-artifact@v6
        with:
          name: storage-spike
          path: |
            contracts/bench/out/*.json
            contracts/bench/out/clear-*.log
            docs/verification/s8-security.json
